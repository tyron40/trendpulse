name: Refresh news
on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trendpulse-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run refresh
      - name: Publish feed
        run: |
          if git diff --quiet -- data/feed.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          git commit -m "Refresh news feed"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 3
          done
          exit 1
